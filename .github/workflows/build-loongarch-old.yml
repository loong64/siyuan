name: CD For SiYuan LoongArch ABI1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'siyuan upstream version'
        required: true
        default: 'v3.6.3'

# ref https://docs.github.com/zh/actions/learn-github-actions/variables
env:
  repo_name: "siyuan"
  repo_owner: "loong64"
  package_json: "app/package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}
    strategy:
      matrix:
        config:
          - os: ubuntu-latest
            name: ubuntu build linux.tar.gz
            kernel_path: "./app/kernel-linux-loongarch64"
            kernel_name: "SiYuan-Kernel"
            build_args_prefix: "-s -w -X"
            build_args_suffix: "Mode=prod"
            goos: "linux"
            goarch: "loong64"
            suffix: "linux.tar.gz"
    steps:
      - name: Check release
        id: check_release
        run: |
          gh release view ${{ inputs.version }} -R ${{ github.repository }} >/dev/null 2>&1 && echo "create=0" >> $GITHUB_ENV || echo "create=1" >> $GITHUB_ENV

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
        with:
          path: ${{ github.workspace }}

      - uses: actions/checkout@v6
        with:
          repository: siyuan-note/siyuan
          ref: ${{ github.event.inputs.version }}
          path: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}

      - name: Copying pnpm-workspace
        run: |
          cp -v ${{ github.workspace }}/pnpm-workspace-ow.yaml ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app/pnpm-workspace.yaml
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/kernel/go.mod
      - run: go version

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Node pnpm
        run: npm install -g pnpm@11.12.0
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app

      - name: Install Node Dependencies
        run: |
          git add . && git diff HEAD --cached
          electron_use_remote_checksums=1 pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app

      - name: Remove Build Directory
        run: rm -rf ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app/build

      - name: Remove Kernel Directory for Linux
        run: rm -rf ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app/kernel-linux

      - name: Overriding go-ole for loongarch64
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/kernel
        run: go get github.com/go-ole/go-ole@6c7f902

      - name: Building Kernel
        uses: OpenListTeam/cgo-actions@v1
        with:
          dir: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/kernel
          targets: 'linux-loong64-abi1.0'
          out-dir: "${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/${{ matrix.config.kernel_path }}"
          output: ${{ matrix.config.kernel_name }}
          x-flags: github.com/${{ env.repo_owner }}/${{ env.repo_name }}/kernel/util.${{ matrix.config.build_args_suffix }}
          tags: "fts5 sqlcipher"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Building Electron App
        run: pnpm electron-builder --linux --config ${{ github.workspace }}/electron-builder-linux-loongarch64.yml --publish=never
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app
        env:
          ELECTRON_MIRROR: "https://github.com/loong64-abi1-0/electron/releases/download/"
          electron_use_remote_checksums: 1

      - name: Create release
        if: env.create == '1'
        run: |
          latestFlag="--latest=true"
          gh release create ${{ github.event.inputs.version }} -R ${{ github.repository }} --title ${{ github.event.inputs.version }} --notes "**Full Changelog**: [${{ github.event.inputs.version }}](https://github.com/siyuan-note/siyuan/releases/tag/${{ github.event.inputs.version }})" ${latestFlag} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Release
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}
        shell: bash
        run: |
          cd app/build/

          # 开启 nullglob：如果没有匹配文件，glob 展开为空字符串，而不是保留通配符本身
          shopt -s nullglob
          
          files=(*.deb *.tar.gz)
          
          if [ ${#files[@]} -eq 0 ]; then
              echo "No .deb or .tar.gz files found."
              exit 1
          fi
          
          echo "Processing ${#files[@]} files..."
          
          # 生成校验和文件
          for f in "${files[@]}"; do
              sha256sum "$f" > "$f.sha256"
          done
          
          ls -lFh "${files[@]/%/.sha256}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          cd ${{ github.workspace }}/go/src/github.com/${{ env.repo_owner }}/${{ env.repo_name }}/app/build
          files=(*.deb *.tar.gz *.sha256)
          for i in "${files[@]}"; do
            gh release upload  ${{ github.event.inputs.version }} $i --repo ${{ github.repository }}
          done
